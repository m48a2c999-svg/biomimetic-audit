name: refs
on:
  workflow_dispatch:
  push:
    paths: ["refs/refs_input.json", "refs/verify_crossref.py", ".github/workflows/refs.yml"]
permissions:
  contents: write
jobs:
  refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python refs/verify_crossref.py
      - run: |
          git config user.name "audit-bot"; git config user.email "audit-bot@users.noreply.github.com"
          git add refs/refs_verified.json; git commit -m "refs: crossref check" || true; git pull -q --rebase; git push
