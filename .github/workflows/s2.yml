name: s2
on:
  workflow_dispatch:
  push:
    paths: ["audit/fetch_s2.py"]
permissions:
  contents: write
jobs:
  s2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python audit/fetch_s2.py
      - run: |
          git config user.name "audit-bot"; git config user.email "audit-bot@users.noreply.github.com"
          git add audit/raw; git commit -m "data: Semantic Scholar supplement" || true
          git pull -q --rebase; git push
